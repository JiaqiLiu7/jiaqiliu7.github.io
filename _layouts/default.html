<!doctype html>
<html lang="en" class="no-js">

<head>
  {% include head.html %}
  {% include head/custom.html %}
</head>

<body>

  {% include browser-upgrade.html %}
  {% include masthead.html %}

  <div id="main" role="main">
    {% include sidebar.html %}

    <article class="page" itemscope itemtype="http://schema.org/CreativeWork">
      {% if page.title %}
      <meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{%
      endif %}
      <div class="page__inner-wrap">
        <section class="page__content" itemprop="text">
          {{ content }}
        </section>
      </div>
    </article>
  </div>

  <div id="clustrmap-container"
    style="position: absolute; top: 0; left: 0; width: 100%; height: 0; opacity: 0.001; z-index: -1; pointer-events: none; overflow: visible;">

    <div id="mmv-click-zone" style="text-align: center; margin: 0 auto; max-width: 200px; cursor: pointer;">
      <!-- <script type="text/javascript" id="mapmyvisitors"
        src="//mapmyvisitors.com/map.js?d=QA_ehUJ8Su72dIoL1FGxfokcGV8Qob3NjMrYjgSqoJQ&cl=ffffff&w=a"></script> -->
      <!-- <script type="text/javascript" id="mapmyvisitors"
        src="//mapmyvisitors.com/map.js?cl=ffffff&w=500&t=n&d=QA_ehUJ8Su72dIoL1FGxfokcGV8Qob3NjMrYjgSqoJQ&co=2d78ad&cmo=3acc3a&cmn=ff5353&ct=ffffff"></script> -->
      <script type="text/javascript" id="mapmyvisitors"
        src="https://mapmyvisitors.com/map.js?cl=ffffff&w=500&t=tt&d=QA_ehUJ8Su72dIoL1FGxfokcGV8Qob3NjMrYjgSqoJQ&co=2d78ad&cmo=ff5353&cmn=3acc3a&ct=ffffff"></script>
    </div>

  </div>

  {% include scripts.html %}

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var toggleBtn = document.getElementById("toggle-clustrmap");
      var mapContainer = document.getElementById("clustrmap-container");
      var mmvClickZone = document.getElementById("mmv-click-zone");

      // 安全跳转逻辑
      // if (mmvClickZone) {
      //   mmvClickZone.addEventListener("click", function () {
      //     window.open("https://mapmyvisitors.com/web/1c5oq", "_blank");
      //   });
      // }

      // 显隐逻辑：通过透明度和文档流控制
      if (toggleBtn && mapContainer) {
        toggleBtn.addEventListener("click", function (e) {
          e.preventDefault();

          const hidden = mapContainer.style.position === "absolute";

          if (hidden) {

            mapContainer.style.position = "relative";
            mapContainer.style.height = "auto";
            mapContainer.style.opacity = "1";
            mapContainer.style.zIndex = "1";
            mapContainer.style.pointerEvents = "auto";

            mapContainer.style.marginTop = "0.5em";
            mapContainer.style.paddingBottom = "2em";

            toggleBtn.style.filter = "grayscale(0%)";

          } else {

            mapContainer.style.position = "absolute";
            mapContainer.style.height = "0";
            mapContainer.style.opacity = "0";
            mapContainer.style.zIndex = "-1";
            mapContainer.style.pointerEvents = "none";

            mapContainer.style.marginTop = "0";
            mapContainer.style.paddingBottom = "0";

            toggleBtn.style.filter = "grayscale(100%)";
          }
        });
      }
    });
  </script>
</body>

</html>
